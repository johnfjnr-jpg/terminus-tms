# Round 7 Phase 1. Runs the PURE suite on every push.
#
# Deliberately runs `npm test` only, never `npm run test:db`. The
# database suite needs real credentials, and putting those into CI is a
# separate decision. Keeping the pure suite free of any database import is
# what makes that separation possible - if a db import ever leaks into
# scripts/tests/cost.test.mjs, this job starts needing secrets and the split
# has been broken.
#
# ROUND 38: THE DECISION IS NOW TAKEN, AND IT IS NOT "CI IS THE GATE".
# A green tick here means the pure suite passed. It has never meant more, and
# in Round 38 the pure suite passed a route answering 500 to every call, which
# an HTTP probe outside CI found in under a minute.
#
# The gate is `npm run verify` and MERGE_GATE.md, which runs this suite plus
# the database suite plus that probe, captures the whole output, and must be
# pasted into the merge. What CI would need in order to take the gate back is
# written down there too.
name: test

on:
  push:
  pull_request:

jobs:
  pure:
    name: pure suite (no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '>=22.12 <23'
      # `npm ci` IS now required, and the property it replaced is recorded
      # rather than quietly dropped. Round 38 added a jsdom harness covering
      # the Commercials tab's wiring - dirty, save and version - because two
      # of the three preceding defects there were wiring rather than logic and
      # a suite of pure functions could not see them. jsdom is a real
      # dependency, so "installs nothing" stopped being true.
      #
      # THIS WAS A LIVE CI BREAK for the length of one commit: the workflow
      # deliberately installed nothing, the new test imports jsdom, and a clean
      # checkout failed. Found by running the suite in an empty directory
      # rather than by reasoning about it.
      #
      # devDependencies stay the only additions, so the SERVER still ships with
      # the four runtime dependencies it had.
      - name: Install (jsdom, for the wiring harness)
        run: npm ci
      - name: Run pure suite
        run: npm test

  # ── THE REACT TREE. Migration Round 1, Phase 3 ─────────────────────────────
  #
  # A SEPARATE JOB, not extra steps on the one above, because the two have
  # different install needs and a shared job hides which half failed. The note
  # at the top of this file still holds: a green tick here means these suites
  # passed, not that the gate did.
  #
  # `npm run verify` runs both of these as stages too. That is deliberate
  # duplication rather than an oversight: CI catches them on every push, and the
  # gate is what gets quoted at a merge. A stage that exists in only one of the
  # two can be skipped by whichever path somebody happens to use.
  react:
    name: react suite and bundle freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '>=22.12 <23'
      - name: Install the React workspace
        run: npm --prefix frontend-react ci
      - name: Run the React suite
        run: npm --prefix frontend-react run test
      # THE COMMITTED BUNDLE IS A SECOND READER OF THE SOURCE (Verification 20).
      # frontend-react/dist is committed so a checkout serves a working approval
      # view with no build step, which means it can silently fall behind the
      # components it was built from. This rebuilds and fails on any difference.
      #
      # It restores dist afterwards, so it is safe to run anywhere, and it needs
      # no root install: it only builds the React workspace.
      - name: The committed bundle matches its source
        run: node scripts/check-dist-fresh.mjs
